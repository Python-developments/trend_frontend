  drift_dev: ^2.22.1
  flutter_lints: ^5.0.0
  # change_app_package_name: ^1.1.0
  # flutter_launcher_icons: "^0.13.1"
  # flutter_native_splash: ^2.4.0

dependency_overrides:
  web: ^1.1.0
  meta: ^1.16.0
  collection: ^1.19.1
flutter_native_splash:
  android_12:
    image: assets/images/png/appIcon2.png
    color: "#000000"
  color: "#000000"
  ios: false

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/png/appIcon.png"
  remove_alpha_ios: true

  #flutter_native_splash:
  # background_image: "assets/images/png/splash.jpg"


  #android_12:
  #image: "assets/images/png/splash.jpg"
  #color: "#DF7E8E"



flutter:

  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/svg/
    - assets/images/png/
    - assets/
    - assets/fonts/
    - assets/images/
    - assets/animations/
    - .env
    - shorebird.yaml
  fonts:
    - family: Proxima Nova
      fonts:
        - asset: assets/fonts/proxima_nova_bold.ttf
          weight: 700
        - asset: assets/fonts/proxima_nova_reg.ttf
          weight: 400
        - asset: assets/fonts/proxima_nova_sbold.otf
          weight: 600
    - family: Traditional Arabic
      fonts:
        - asset: assets/fonts/traditional_arabic_regular.ttf
    - family: AE Graph
      fonts:
        - asset: assets/fonts/ae_graph_regular.ttf
    - family: Margaret
      fonts:
        - asset: assets/fonts/margaret_bold.otf
